server {
  listen 80;
  server_name localhost; # Will be overridden by App Platform or other environments

  root /usr/share/nginx/html;
  index index.html index.htm;

  location / {
    try_files $uri $uri/ /index.html; # Important for single-page applications
  }

  # Optional: Add headers for caching, security, etc.
  # location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|css|js)$ {
  #   expires 1M;
  #   access_log off;
  #   add_header Cache-Control "public";
  # }
}
